###############################################################################
# Sample configuration for the Random Entities feature.
# Based on the configuration for OptiFine's Random Entities, fully backwards
# compatible with the legacy Random Mobs format.
###############################################################################
# This file is offered without any copyright restrictions.
# Please copy and modify it to suit your needs.
#
# Alternate textures may be placed in any of three folders. The folders are
# searched in this order and the first one containing at least one alternate
# texture wins:
#   mcpatcher/mob/   mirrors textures/entity/  (legacy MCPatcher layout)
#   optifine/mob/    mirrors textures/entity/  (legacy OptiFine layout)
#   optifine/random/ mirrors the whole textures/ tree (modern layout)
#
# Primary (vanilla) texture:
#   assets/minecraft/textures/entity/creeper/creeper.png
# Alts:
#   assets/minecraft/mcpatcher/mob/creeper/creeper2.png
#   assets/minecraft/mcpatcher/mob/creeper/creeper3.png
#   assets/minecraft/mcpatcher/mob/creeper/creeper4.png
#   etc.
# The same layout works in the optifine folders as well:
#   assets/minecraft/optifine/mob/creeper/creeper2.png
#   assets/minecraft/optifine/random/entity/creeper/creeper2.png
# Properties (optional), next to the alternate textures:
#   assets/minecraft/optifine/random/entity/creeper/creeper.properties
#
# Non-living entities such as paintings are supported through the modern
# optifine/random layout only, since it mirrors the complete textures/ tree:
#
# Primary (vanilla) texture:
#   assets/minecraft/textures/painting/burning_skull.png
# Alts:
#   assets/minecraft/optifine/random/painting/burning_skull2.png
#   assets/minecraft/optifine/random/painting/burning_skull3.png
#   assets/minecraft/optifine/random/painting/burning_skull4.png
#   etc.
# Properties (optional):
#   assets/minecraft/optifine/random/painting/burning_skull.properties
#
# Textures ending with a digit use the separator "."
#
# Primary (vanilla) texture:
#   assets/minecraft/textures/entity/warden/warden_pulsating_spots_2.png
# Alts:
#   assets/minecraft/optifine/random/entity/warden/warden_pulsating_spots_2.2.png
#   assets/minecraft/optifine/random/entity/warden/warden_pulsating_spots_2.3.png
#   assets/minecraft/optifine/random/entity/warden/warden_pulsating_spots_2.4.png
#   etc.
# Properties (optional):
#   assets/minecraft/optifine/random/entity/warden/warden_pulsating_spots_2.properties
#
# This file consists of a sequence of rules, numbered from 1.
#
# Each rule specifies a range of entity textures to use and one or more
# conditions under which to use them.
#
# The entity coordinates when it spawns (single player) or when it is first
# seen by the client (multiplayer) are checked against each rule in sequence.
# The first rule that matches wins. If no rule matches, the default texture
# (e.g. creeper.png) is used.
#
# If no ".properties" file is present for an entity, then all available
# textures are used for that type of entity.
#
# Entities with multiple textures will use the ".properties" file for the base
# texture. In other words, you do not need to create
#   wolf.properties
#   wolf_tame.properties
#   wolf_angry.properties
# Just wolf.properties will work for all three, provided you have the same
# number of textures for each. Similarly for "_eyes" and "_overlay".
#
# All property names are case-sensitive.
# All paths are relative to assets/minecraft unless otherwise stated.
###############################################################################

###############################################################################
# Rule format.
# <n> is the rule index. This is a number that links the individual properties
# together to form a rule.
# <n> starts at 1.
###############################################################################

# (Required) Range of entity textures to use.
# The texture index "1" is the default texture from "assets/minecraft/textures".
textures.<n>=<list of texture indices>
# Alternatively the legacy Random Mobs property "skins.<n>" can be used.
skins.<n>=<list of skins>

# (Optional) List of weights to apply to the random choice
# Weights do not have to total 100 or any other particular value.
# The number of weights should match the number of textures.
weights.<n>=<same-size list of weights>

# (Optional) List of biomes
# Both the 1.7.10 biome names (case-insensitive, spaces optional) and the
# modern names are accepted. Modern names are mapped onto their 1.7.10
# counterpart where one exists, e.g. windswept_hills -> Extreme Hills,
# badlands -> Mesa, dark_forest -> Roofed Forest, snowy_plains -> Ice Plains.
# Biomes added by mods can also be used.
biomes.<n>=<biome list>

# (Optional) Height ranges
# Replaces the legacy minHeight and maxHeight properties.
# World heights are 0-255 on 1.7.10, so negative values do not apply.
heights.<n>=<height ranges>

# (Optional) Entity name
# Uses syntax similar to the Custom Item Textures NBT tags.
# A value starting with "!" performs a negative match (not).
# Examples:
#  - Match string: "name=Pinky"
#  - Match special formatting: "name=\u00a74\u00a7oPinky"
#    (for best compatibility, use the escape sequence '\u00a7' instead of '§')
#  - Wildcards using "?" and "*": "name=pattern:Pinky*"
#  - Wildcards, case insensitive: "name=ipattern:Pinky*"
#  - Java regular expressions: "name=regex:Pin(k)+y"
#    (see http://docs.oracle.com/javase/6/docs/api/java/util/regex/Pattern.html)
#  - Java regular expressions, case insensitive: "name=iregex:Pin(k)+y"
# Any backslashes in the match string must be doubled.
# Literal backslashes within a regular expression or wildcard must be quadrupled.
# Correct:
#   name=regex:\\d+
#   name=regex:\\\\
#   name=/\\/\\
# Wrong:
#   name=regex:\d+
#   name=regex:\\
#   name=/\/\
name.<n>=<name>

# Professions (optional)
# List of villager professions with optional levels
#
# Entry format
#   <profession>[:level1,level2,...]
#
# The modern profession names are mapped onto the five 1.7.10 professions:
#   farmer fisherman shepherd fletcher    -> farmer (0)
#   librarian                             -> librarian (1)
#   cleric                                -> priest (2)
#   armorer weaponsmith toolsmith         -> blacksmith (3)
#   butcher leatherworker                 -> butcher (4)
# Numeric profession ids (0-4) are accepted as well.
# 1.7.10 villagers have no career levels, so level lists are accepted but
# ignored.
#
# Example:
#   # Professions farmer (all careers) or librarian
#   professions=farmer librarian
#   # Professions full
#   professions=minecraft:fisherman minecraft:shepherd minecraft:butcher
professions.<n>=<professions>

# Colors (optional)
# List of wolf collar colors or sheep fleece colors
# Colors: white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black
# Example:
#   colors.2=pink magenta purple
# The legacy property "collarColors" is also recognized.
colors.<n>=<colors>

# Baby (optional)
# Only valid for ageable mobs
baby.<n>=<true/false>

# Health (optional)
# Range of health values, can also be given in percent.
# Only valid for mobs.
# Example:
#   health.1=10
#   health.2=5-8 10-12
#   health.3=0-50%
health.<n>=<list>

# Moon phase (Optional)
# List of moon phases (0-7)
# Example
#   moonPhase.1=3
#   moonPhase.2=0 1 2
#   moonPhase.3=0-2 4-7
moonPhase.<n>=<list>

# Day time (Optional)
# List of day times in ticks (0-24000)
# Example
#   dayTime.1=2000-10000
#   dayTime.2=0-1000 18000-24000
dayTime.<n>=<list>

# Weather (Optional)
# Several values can be specified, separated by space
# for example "weather=clear rain thunder"
weather.<n>=<clear|rain|thunder>

# Sizes (optional)
# Only valid for mobs with multiple sizes (0-255 for slimes and magma cubes)
# Slimes and magma cubes naturally spawn in three sizes: 0=small, 1=medium, 3=big.
# Example
#   sizes.1=3
#   sizes.2=0 1 3
#   sizes.3=0-2 4-7
sizes.<n>=<list>

# NBT tags (optional)
# See "cit_single.properties" for more details.
# Works with NBT data that is available on the client side. In practice this
# means single player, since dedicated servers do not send entity NBT to the
# client.
nbt.<n>.<tag>=<value>

# Blocks (optional)
# Checks the block on which the entity is standing.
# Uses the same format as ctm.properties matchBlocks.
# Example
#   blocks.1=grass mycelium
blocks.<n>=<blocks>

# Seed offset
# Adds a fixed offset to the random seed
seedOffset.<n>=<offset>

# Seed source
# Defines which entity is to be used for the random seed
seedSource.<n>=<entity|vehicle>

###############################################################################
# Examples:
# creeper/creeper.properties:
###############################################################################
# Use creeper10.png through creeper14.png for all underground creepers.
# creeper13.png will be used 7.3% (3/(10+10+10+3+10)) of the time.
textures.1=10-14
weights.1=10 10 10 3 10
heights.1=0-55

# Use 5, 7, 9 in high, hilly areas.
textures.2=5 7 9
biomes.2=windswept_hills desert forest badlands
heights.2=80-255

# Fallback rule if nothing else matches. Remember, if no rule matches, only
# the base creeper/creeper.png will be used.
textures.3=1-4 6 8 15-20
